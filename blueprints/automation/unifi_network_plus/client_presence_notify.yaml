blueprint:
  name: UniFi Network+ - Client Presence Notification
  description: >-
    Notify when one or more tracked clients arrive home or leave, using
    this integration's device_tracker entities (built from the
    controller's full known-client roster, not just who's currently
    connected - see the README's "Client presence" section).
  domain: automation
  source_url: https://github.com/manuel-mahr/unifi-network-plus/blob/main/blueprints/automation/unifi_network_plus/client_presence_notify.yaml
  input:
    client_trackers:
      name: Clients to watch
      selector:
        entity:
          multiple: true
          filter:
            domain: device_tracker
    notify_arriving:
      name: Notify on arrival
      default: true
      selector:
        boolean: {}
    notify_leaving:
      name: Notify on departure
      default: true
      selector:
        boolean: {}
    notify_action:
      name: Notification action
      description: >-
        The action(s) to run. Reference "{{ presence_message }}" in your
        message text to use the ready-made description of what happened.
      selector:
        action: {}

triggers:
  - trigger: state
    entity_id: !input client_trackers
    to: "home"
    id: arrived
  - trigger: state
    entity_id: !input client_trackers
    to: "not_home"
    id: left

variables:
  notify_arriving: !input notify_arriving
  notify_leaving: !input notify_leaving
  presence_message: >-
    {% if trigger.id == 'arrived' %}
      {{ trigger.to_state.name }} arrived home.
    {% else %}
      {{ trigger.to_state.name }} left home.
    {% endif %}

conditions:
  - condition: or
    conditions:
      - condition: and
        conditions:
          - "{{ trigger.id == 'arrived' }}"
          - "{{ notify_arriving }}"
      - condition: and
        conditions:
          - "{{ trigger.id == 'left' }}"
          - "{{ notify_leaving }}"

actions: !input notify_action
