name: Feature request
description: Suggest an entity, control, or capability this integration doesn't have yet
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What's the use case?
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller model / firmware (if the request is model-specific)
